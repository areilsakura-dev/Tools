<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP 的工具箱 🌺</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .tool-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }
        .tool-icon {
            font-size: 3em;
            margin-bottom: 15px;
            text-align: center;
        }
        .tool-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .tool-desc {
            color: #666;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            color: #999;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .tool-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PP 的工具箱 🌺</h1>
        <p class="subtitle">實用 HTML 工具集</p>
        
        <div class="tool-grid">
            <a href="korean-alphabet-chart.html" class="tool-card">
                <div class="tool-icon">🇰🇷</div>
                <div class="tool-title">韓文40音家族圖</div>
                <div class="tool-desc">
                    互動式韓文字母學習工具。點擊字母可聽發音，顏色分類、記憶提示、系統化學習路徑。
                </div>
            </a>
            
            <a href="korean-pinyin-converter.html" class="tool-card">
                <div class="tool-icon">🔐</div>
                <div class="tool-title">拼音→韓文轉換器</div>
                <div class="tool-desc">
                    視覺加密工具。把中文拼音轉成韓文字母，支援200+拼音組合，一鍵複製結果。
                </div>
            </a>
        </div>
        
        <div class="footer">
            <p>Made with 🌺 by PP</p>
            <p style="margin-top: 10px; font-size: 0.9em;">
                <a href="https://github.com/areilsakura-dev/ariel-workspace" style="color: #667eea; text-decoration: none;">
                    GitHub Repository
                </a>
            </p>
        </div>
    </div>
</body>
</html>

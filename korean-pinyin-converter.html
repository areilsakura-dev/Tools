<!DOCTYPE html>
<html lang="zh-TW">

        }
        
        .container {

            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        
        .input-group {

        }
        
        label {
            display: block;
            font-size: 1.1em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #output {
            background: #f8f9fa;
            font-size: 1.5em;
            line-height: 1.8;
            color: #333;
        }
        
        .button-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-convert {
            background: #667eea;
            color: white;
            flex: 1;
            max-width: 200px;
        }
        
        .btn-convert:active {

        }
        
        .btn-copy {

        }
        
        .btn-copy:active {
            background: #45a049;
            transform: scale(0.98);
        }
        
        .btn-clear {

            color: white;
        }
        
        .btn-clear:active {

            transform: scale(0.98);
        }

            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .examples h3 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .example-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .example-item:active {
            background: #ffe8a1;
        }
        
        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .info h3 {
            color: #1976D2;
            margin-bottom: 10px;
        }
        
        .info ul {
            margin-left: 20px;
        }
        
        .footer {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9em;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .button-area {
                flex-direction: column;
            }
            
            button {
                width: 100%;
                max-width: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>拼音 → 韓文轉換器 🔐</h1>
        <p class="subtitle">把中文拼音轉成韓文字母</p>
        
        <div class="info">
            <h3>💡 使用說明</h3>
            <ul>
                <li>輸入中文拼音（空格分隔）</li>

                <li>手機用戶：點擊範例快速試用</li>
            </ul>
        </div>
        
        <div class="input-group">
            <label>📝 輸入拼音</label>
            <textarea id="input" placeholder="例如：wo ai ni"></textarea>
        </div>
        
        <div class="button-area">
            <button class="btn-convert" onclick="convert()">🔄 轉換</button>
            <button class="btn-copy" onclick="copyOutput()">📋 複製</button>
            <button class="btn-clear" onclick="clearAll()">🗑️ 清空</button>
        </div>
        
        <div class="input-group">
            <label>🇰🇷 韓文輸出</label>
            <textarea id="output" readonly placeholder="轉換結果會顯示在這裡..."></textarea>
        </div>
        
        <div class="examples">
            <h3>📌 快速範例（點擊試用）</h3>
            <div class="example-item" onclick="loadExample('wo ai ni')">
                <strong>我愛你：</strong> wo ai ni
            </div>
            <div class="example-item" onclick="loadExample('jin wan jian mian')">
                <strong>今晚見面：</strong> jin wan jian mian
            </div>
            <div class="example-item" onclick="loadExample('lao di fang deng ni')">
                <strong>老地方等你：</strong> lao di fang deng ni
            </div>
        </div>
        
        <div class="footer">
            <p>Made with 🌺 by Ariel</p>
        </div>
    </div>

        function convert() {
            const input = document.getElementById('input').value.trim();
            if (!input) {
                alert('請輸入拼音！');
                return;
            }
            
            // 分割成音節
            const syllables = input.toLowerCase().split(/\s+/);
            const results = [];
            
            for (let syllable of syllables) {
                // 移除數字聲調
                syllable = syllable.replace(/[1-4]/g, '');
                
                // 查表轉換
                if (py2kr[syllable]) {
                    results.push(py2kr[syllable]);
                } else {
                    results.push('[' + syllable + ']');
                }
            }
            
            document.getElementById('output').value = results.join(' ');
        }
        
        function copyOutput() {
            const output = document.getElementById('output');
            if (!output.value) {
                alert('沒有內容可複製！');
                return;
            }
            output.select();
            document.execCommand('copy');
            alert('✅ 已複製！');
        }
        
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
        }
        
        function loadExample(text) {
            document.getElementById('input').value = text;
            convert();
        }
        
        // Enter 快捷鍵
        document.getElementById('input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                convert();
            }
        });
        
        console.log('🔐 轉換器已就緒');
